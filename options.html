<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Env Switcher settings</title>
    <link rel="stylesheet" href="options.css">
    <script src="shared.js" defer></script>
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <h1>Env Switcher</h1>
          <p>Group site URLs into apps, then switch the current page between their environments.</p>
        </div>
        <button id="save-button" class="primary-button" type="button">Save changes</button>
      </header>

      <p class="help-text">
        Use a site root for each base URL, such as <code>https://localhost:3000</code>.
        The current page's path, query, and hash are carried over.
      </p>

      <form id="add-app-form" class="add-app-form">
        <label for="new-app-name">New app name</label>
        <input id="new-app-name" name="appName" type="text" required maxlength="80"
               placeholder="e.g. Storefront">
        <button type="submit">Add app</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <div id="apps-list" class="apps-list"></div>
    </main>
  </body>
</html>
